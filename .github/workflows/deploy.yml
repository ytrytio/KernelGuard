name: Deploy Bot

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        run: |
          cd ~/KernelGuard
          git pull
          /home/glor/.venv/bin/uv sync
          systemctl --user restart kernelguard
